<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>天気猫オラクル</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1c2440">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Shippori+Mincho:wght@400;600;800&display=swap');

  :root{
    --bg:#1c2440;
    --bg-deep:#12172c;
    --card-bg:#232c4e;
    --ink:#eef0fb;
    --ink-soft:#9aa3c9;
    --umbrella:#a9835a;
    --umbrella-deep:#8a6a45;
    --paper:#f2ead9;
    --line:#3d4a74;
    --shadow:rgba(5,8,25,0.5);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{overflow-x:hidden;}
  body{
    background:
      radial-gradient(ellipse at 15% 0%, rgba(169,131,90,0.10) 0%, transparent 45%),
      radial-gradient(ellipse at 90% 100%, rgba(169,131,90,0.08) 0%, transparent 50%),
      var(--bg);
    background-attachment:fixed;
    color:var(--ink);
    font-family:'Zen Maru Gothic',sans-serif;
    min-height:100vh;
    position:relative;
  }
  /* 霧雨の質感 */
  body::before{
    content:'';
    position:fixed;inset:0;
    background-image:radial-gradient(rgba(242,234,217,0.28) 1px, transparent 1px);
    background-size:56px 56px;
    pointer-events:none;
    z-index:0;
    opacity:0.45;
  }
  .container{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:22px 16px 70px;}

  header{text-align:center;padding:18px 0 22px;}
  .star-icon{font-size:34px;display:block;margin-bottom:6px;}
  h1{
    font-family:'Shippori Mincho',serif;font-weight:800;
    font-size:clamp(24px,6.5vw,32px);
    color:var(--umbrella);
    letter-spacing:0.1em;
    margin-bottom:6px;
    text-shadow:0 0 18px rgba(169,131,90,0.3);
  }
  .tagline{font-size:12.5px;color:var(--ink-soft);letter-spacing:0.12em;}
  .kanji-divider{display:flex;align-items:center;gap:10px;margin:18px 0 20px;}
  .kanji-divider .ln{flex:1;height:1px;background:var(--line);}
  .kanji-divider span{font-size:11px;color:var(--ink-soft);letter-spacing:0.2em;}

  /* タブ */
  .tabs{display:flex;gap:8px;margin-bottom:20px;background:rgba(255,255,255,0.04);border:1px solid var(--line);border-radius:14px;padding:4px;}
  .tab{
    flex:1;text-align:center;padding:10px 6px;border-radius:11px;
    font-size:13.5px;font-weight:700;color:var(--ink-soft);
    cursor:pointer;transition:all 0.25s;letter-spacing:0.05em;
  }
  .tab.active{background:var(--umbrella);color:var(--bg-deep);box-shadow:0 3px 10px var(--shadow);}

  .panel{display:none;}
  .panel.active{display:block;}

  .step{background:var(--card-bg);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 2px 10px var(--shadow);}
  .step-label{font-size:12px;color:var(--umbrella);letter-spacing:0.1em;margin-bottom:10px;display:flex;align-items:center;gap:6px;font-weight:700;}
  .step-num{background:var(--umbrella);color:var(--bg-deep);width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;}
  textarea{
    width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--line);border-radius:10px;
    color:var(--ink);font-family:'Zen Maru Gothic',sans-serif;font-size:14px;
    padding:11px;outline:none;transition:border-color 0.3s;resize:none;height:64px;
  }
  textarea:focus{border-color:var(--umbrella);box-shadow:0 0 0 3px rgba(169,131,90,0.14);}
  textarea::placeholder{color:#6b7399;}

  /* カード（正方形：天気猫カード 2048:2048） */
  .card-area{display:flex;flex-direction:column;gap:14px;margin-bottom:16px;}
  .card-row{display:flex;gap:12px;}
  .card-wrap{flex:1;}
  .card-position{font-size:12px;color:var(--umbrella);font-weight:700;letter-spacing:0.06em;margin-bottom:6px;padding-left:2px;display:flex;align-items:center;gap:6px;}
  .card-position .dot{width:6px;height:6px;border-radius:50%;background:var(--umbrella);flex-shrink:0;}

  .card-slot{
    width:100%;aspect-ratio:1/1;
    background:linear-gradient(160deg, var(--card-bg) 0%, var(--bg-deep) 100%);
    border-radius:14px;
    cursor:pointer;transition:transform 0.25s, box-shadow 0.25s;
    overflow:hidden;position:relative;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 16px var(--shadow);
    border:2px solid var(--umbrella-deep);
  }
  .card-slot::before{
    content:'';position:absolute;inset:6px;
    border:1px solid rgba(169,131,90,0.35);
    border-radius:9px;
    pointer-events:none;
  }
  .card-slot:hover:not(.revealed){transform:translateY(-3px);box-shadow:0 8px 22px var(--shadow);}
  .card-slot.revealed{cursor:default;border-color:var(--line);}
  .card-back-mark{font-family:'Shippori Mincho',serif;font-size:12.5px;color:var(--paper);text-align:center;letter-spacing:0.15em;opacity:0.92;padding:0 6px;}
  .card-back-mark .umbrella{font-size:32px;display:block;margin-bottom:8px;letter-spacing:0;}
  .card-img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-name-overlay{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent, rgba(18,23,44,0.85));
    padding:18px 8px 8px;
    font-family:'Shippori Mincho',serif;
    font-size:13px;color:var(--paper);text-align:center;letter-spacing:0.08em;
  }
  @keyframes flipIn{0%{transform:rotateY(90deg) scale(0.85);opacity:0;}100%{transform:rotateY(0) scale(1);opacity:1;}}
  .just-revealed{animation:flipIn 0.5s ease-out forwards;}

  .btn{width:100%;padding:14px;border-radius:12px;font-family:'Zen Maru Gothic',sans-serif;font-size:14.5px;font-weight:700;cursor:pointer;letter-spacing:0.06em;transition:all 0.3s;margin-bottom:12px;display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-ai{background:linear-gradient(135deg,#a9835a,#8a6a45);border:none;color:var(--bg-deep);font-size:15px;box-shadow:0 3px 12px rgba(138,106,69,0.35);}
  .btn-ai:hover:not(:disabled){box-shadow:0 5px 20px rgba(138,106,69,0.45);transform:translateY(-2px);}
  .btn:disabled{opacity:0.4;cursor:not-allowed;transform:none !important;}
  .btn-reset{background:transparent;border:1px solid var(--line);color:var(--ink-soft);font-size:13px;}
  .btn-reset:hover{border-color:var(--umbrella);color:var(--umbrella);}

  .ai-result{
    background:var(--card-bg);border:1px solid var(--umbrella-deep);border-radius:16px;
    padding:22px;margin-top:4px;box-shadow:0 4px 20px var(--shadow);display:none;
    position:relative;
  }
  .ai-result.show{display:block;}
  .ai-result-header{display:flex;align-items:center;gap:8px;margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line);}
  .ai-result-header span{font-size:22px;}
  .ai-result-header h3{font-family:'Shippori Mincho',serif;font-size:16px;color:var(--umbrella);letter-spacing:0.08em;}
  .ai-reading{font-size:14.5px;line-height:2;color:var(--ink);}
  .blessing{margin-top:14px;padding:14px 16px;background:rgba(169,131,90,0.09);border-radius:10px;border-left:3px solid var(--umbrella);}
  .blessing h4{color:var(--umbrella);font-size:12px;margin-bottom:6px;letter-spacing:0.05em;}
  .loading{text-align:center;padding:30px 10px;color:var(--ink-soft);font-size:13.5px;}
  .loading-mark{font-size:26px;display:block;margin-bottom:10px;animation:sway 1.6s ease-in-out infinite;}
  @keyframes sway{0%,100%{transform:rotate(-6deg);}50%{transform:rotate(6deg);}}
  .error-msg{background:rgba(212,110,90,0.1);border:1px solid rgba(212,110,90,0.4);border-radius:10px;padding:11px 14px;color:#e7a89a;font-size:13px;margin-top:8px;display:none;}
  .error-msg.show{display:block;}

  footer{text-align:center;margin-top:26px;font-size:11px;color:var(--ink-soft);letter-spacing:0.1em;opacity:0.7;}

  @media (max-width:380px){
    .card-row{flex-direction:column;}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <span class="star-icon">☂️</span>
    <h1>天気猫オラクル</h1>
    <p class="tagline">空模様が映す、今のあなたへのメッセージ</p>
  </header>

  <div class="tabs">
    <div class="tab active" data-mode="one" onclick="switchMode('one')">一枚引き</div>
    <div class="tab" data-mode="three" onclick="switchMode('three')">三枚引き</div>
  </div>

  <div class="step">
    <div class="step-label"><span class="step-num">1</span>今、心にあることを教えてください</div>
    <textarea id="questionInput" placeholder="例：最近の自分の調子について知りたい…（省略可）"></textarea>
  </div>

  <!-- 一枚引き -->
  <div class="panel active" id="panel-one">
    <div class="kanji-divider"><span class="ln"></span><span>今のあなたへ 一枚のお告げ</span><span class="ln"></span></div>
    <div class="card-area">
      <div class="card-wrap">
        <div class="card-slot" id="slot-0" onclick="revealCard(0)">
          <div class="card-back-mark"><span class="umbrella">☂️</span>タップして<br>めくる</div>
        </div>
      </div>
    </div>
    <button class="btn btn-ai" id="btnAI-one" onclick="getAIReading('one')" disabled>🐾 時雨に伺う</button>
    <div class="error-msg" id="errorMsg-one"></div>
    <div class="ai-result" id="aiResult-one">
      <div class="ai-result-header"><span>🐾</span><h3>時雨のお告げ</h3></div>
      <div class="ai-reading" id="aiReading-one"></div>
    </div>
    <button class="btn btn-reset" onclick="resetMode('one')">🔄 最初からやり直す</button>
  </div>

  <!-- 三枚引き -->
  <div class="panel" id="panel-three">
    <div class="kanji-divider"><span class="ln"></span><span>空模様の巡り 三枚のお告げ</span><span class="ln"></span></div>
    <div class="card-area">
      <div class="card-row">
        <div class="card-wrap">
          <div class="card-position"><span class="dot"></span>今のあなた</div>
          <div class="card-slot" id="slot-1" onclick="revealCard(1)">
            <div class="card-back-mark"><span class="umbrella">☂️</span>タップして<br>めくる</div>
          </div>
        </div>
        <div class="card-wrap">
          <div class="card-position"><span class="dot"></span>手放していいもの</div>
          <div class="card-slot" id="slot-2" onclick="revealCard(2)">
            <div class="card-back-mark"><span class="umbrella">☂️</span>タップして<br>めくる</div>
          </div>
        </div>
        <div class="card-wrap">
          <div class="card-position"><span class="dot"></span>これから続く道</div>
          <div class="card-slot" id="slot-3" onclick="revealCard(3)">
            <div class="card-back-mark"><span class="umbrella">☂️</span>タップして<br>めくる</div>
          </div>
        </div>
      </div>
    </div>
    <button class="btn btn-ai" id="btnAI-three" onclick="getAIReading('three')" disabled>🐾 時雨に伺う</button>
    <div class="error-msg" id="errorMsg-three"></div>
    <div class="ai-result" id="aiResult-three">
      <div class="ai-result-header"><span>🐾</span><h3>時雨のお告げ</h3></div>
      <div class="ai-reading" id="aiReading-three"></div>
    </div>
    <button class="btn btn-reset" onclick="resetMode('three')">🔄 最初からやり直す</button>
  </div>

  <footer>天気猫オラクルカードシリーズ</footer>
</div>

<script>
// ===== カードデータ =====
const CARDS = [
  {slug:'01_hare', name:'晴れ', message:'順風満帆・好調。心にかかっていた雲が晴れ、物事がすんなりと運んでいくとき。'},
  {slug:'02_ame', name:'雨', message:'浄化・我慢の時。涙も雨も、いつかは止む。今は静かに耐えるとき。'},
  {slug:'03_kumori', name:'曇り', message:'迷い・様子見。答えを急がず、ゆっくり空模様を見極めていいとき。'},
  {slug:'04_yuki', name:'雪', message:'静けさ・内省。物音のない世界で、自分の内側とそっと向き合うとき。'},
  {slug:'05_kiri', name:'霧', message:'先の見えない時期。焦らず、一歩ずつ足元を確かめて進んでいい。'},
  {slug:'06_niji', name:'虹', message:'努力が報われる兆し。雨上がりの空に、ご褒美のような光が差す。'},
  {slug:'07_kaminari', name:'雷', message:'衝撃的な変化・目覚め。心を揺さぶる出来事が、新しい気づきをもたらす。'},
  {slug:'08_kaze', name:'風', message:'変化の兆し・後押し。追い風が、次の一歩を軽くしてくれる。'},
  {slug:'09_taifuu', name:'台風', message:'大きな転機・試練。荒れる時こそ、自分の芯の強さが試されるとき。'},
  {slug:'10_asayake', name:'朝焼け', message:'新しい始まり。夜が明け、新しい一日、新しい章が静かに始まる。'},
  {slug:'11_yuuyake', name:'夕焼け', message:'一区切り・感謝。今日という日に、静かに区切りをつけるとき。'},
  {slug:'12_hanagumori', name:'花曇り', message:'春の物思い・繊細な気持ち。華やかさの裏にある、ふとした寂しさに寄り添って。'},
  {slug:'13_satsukibare', name:'五月晴れ', message:'爽快な好機。迷いが晴れ、思い切り動き出せるとき。'},
  {slug:'14_kogarashi', name:'木枯らし', message:'厳しさの中の覚悟。冷たい風にも、じっと耐える強さが宿っている。'},
  {slug:'15_haruichiban', name:'春一番', message:'突然の転機・勢い。予期せぬ風が、新しい季節を連れてくる。'}
];
const IMG_BASE = '/images/';

let currentMode = 'one';
let drawnCards = {}; // slotIndex -> card

function shuffleDraw(n){
  const shuffled = [...CARDS].sort(() => Math.random() - 0.5);
  return shuffled.slice(0, n);
}

function switchMode(mode){
  currentMode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
  document.getElementById('panel-one').classList.toggle('active', mode === 'one');
  document.getElementById('panel-three').classList.toggle('active', mode === 'three');
}

function ensureDrawn(mode){
  if (mode === 'one' && !drawnCards[0]){
    drawnCards[0] = shuffleDraw(1)[0];
  }
  if (mode === 'three' && !(drawnCards[1] && drawnCards[2] && drawnCards[3])){
    const [a,b,c] = shuffleDraw(3);
    drawnCards[1] = a; drawnCards[2] = b; drawnCards[3] = c;
  }
}
ensureDrawn('one');

function revealCard(slotIndex){
  const mode = slotIndex === 0 ? 'one' : 'three';
  ensureDrawn(mode);
  const slot = document.getElementById('slot-' + slotIndex);
  if (slot.classList.contains('revealed')) return;
  const card = drawnCards[slotIndex];
  slot.classList.add('revealed', 'just-revealed');
  setTimeout(() => slot.classList.remove('just-revealed'), 500);
  const nameEscaped = card.name.replace(/'/g, "\\'");
  slot.innerHTML = `
    <img class="card-img" src="${IMG_BASE}${card.slug}.jpg" alt="${card.name}"
      onerror="this.outerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:30px;flex-direction:column;gap:8px;color:#f2ead9\\'><span>🐾</span><span style=\\'font-size:13px;text-align:center;padding:0 8px\\'>${nameEscaped}</span></div>'">
    <div class="card-name-overlay">${card.name}</div>
  `;
  checkReadyForMode(mode);
}

function checkReadyForMode(mode){
  if (mode === 'one'){
    const ready = document.getElementById('slot-0').classList.contains('revealed');
    document.getElementById('btnAI-one').disabled = !ready;
  } else {
    const ready = [1,2,3].every(i => document.getElementById('slot-' + i).classList.contains('revealed'));
    document.getElementById('btnAI-three').disabled = !ready;
  }
}

const SYSTEM_PERSONA = `あなたは「時雨（しぐれ）」。藍染め風の甚平をまとい、いつも茶色の番傘を携えている黒猫の案内人です。空模様と一緒に旅をしながら、出会う人にそっと寄り添う、親しみやすくも少し詩的な語り口で話してください。断定的すぎず、天気にたとえながら温かく語りかけてください。**のようなマークダウン記号や見出し記号は一切使わず、普通の文章だけで書いてください。`;

async function callReading(prompt){
  const res = await fetch('/api/reading', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      model: 'claude-sonnet-4-5-20250929',
      max_tokens: 900,
      messages: [{role: 'user', content: prompt}]
    })
  });
  const data = await res.json();
  let text = data.content?.[0]?.text || '';
  if (!text) throw new Error(data.error?.message || '解釈を取得できませんでした');
  // 万一Markdown記号が混ざっていた場合の保険
  text = text.replace(/\*\*/g, '').replace(/^#+\s*/gm, '');
  return text;
}

async function getAIReading(mode){
  const question = document.getElementById('questionInput').value.trim();
  const btnAI = document.getElementById('btnAI-' + mode);
  const aiResult = document.getElementById('aiResult-' + mode);
  const aiReading = document.getElementById('aiReading-' + mode);
  const errorMsg = document.getElementById('errorMsg-' + mode);
  errorMsg.classList.remove('show');
  btnAI.disabled = true;
  aiResult.classList.add('show');
  aiReading.innerHTML = `<div class="loading"><span class="loading-mark">☂️</span>時雨が空模様に耳を澄ませています……</div>`;

  let prompt;
  if (mode === 'one'){
    const card = drawnCards[0];
    prompt = `${SYSTEM_PERSONA}

【ご質問・今の気持ち】
${question || '（入力なし：今のあなたへのメッセージをお願いします）'}

【引いたカード】
「${card.name}」— ${card.message}

このカードが今のあなたに伝えたいメッセージを、200〜250文字程度で温かく具体的に伝えてください。最後に「時雨からひとこと」として、短い一言の言葉を添えてください。`;
  } else {
    const c1 = drawnCards[1], c2 = drawnCards[2], c3 = drawnCards[3];
    prompt = `${SYSTEM_PERSONA}

【ご質問・今の気持ち】
${question || '（入力なし：今のあなたへのメッセージをお願いします）'}

【引いた三枚】
1. 今のあなた:「${c1.name}」— ${c1.message}
2. 手放していいもの:「${c2.name}」— ${c2.message}
3. これから続く道:「${c3.name}」— ${c3.message}

この三枚のつながりを、一つの流れのある物語として400〜500文字程度で温かく読み解いてください。それぞれのカードの位置（今／手放すもの／これから）を踏まえて具体的に伝えてください。最後に「時雨からひとこと」として、短い一言の言葉を添えてください。`;
  }

  try{
    const text = await callReading(prompt);
    const parts = text.split('時雨からひとこと');
    const main = parts[0].trim();
    const blessing = parts[1]?.trim().replace(/^[：:]\s*/, '') || '';
    aiReading.innerHTML = `<p>${main.replace(/\n/g, '<br>')}</p>${blessing ? `<div class="blessing"><h4>☂️ 時雨からひとこと</h4><p>${blessing}</p></div>` : ''}`;
  }catch(err){
    aiResult.classList.remove('show');
    errorMsg.textContent = `エラーが発生しました……: ${err.message}`;
    errorMsg.classList.add('show');
  }
  btnAI.disabled = false;
}

function resetMode(mode){
  document.getElementById('questionInput').value = '';
  document.getElementById('aiResult-' + mode).classList.remove('show');
  document.getElementById('errorMsg-' + mode).classList.remove('show');

  if (mode === 'one'){
    drawnCards[0] = null;
    const slot = document.getElementById('slot-0');
    slot.className = 'card-slot';
    slot.innerHTML = `<div class="card-back-mark"><span class="umbrella">☂️</span>タップして<br>めくる</div>`;
    document.getElementById('btnAI-one').disabled = true;
  } else {
    [1,2,3].forEach(i => {
      drawnCards[i] = null;
      const slot = document.getElementById('slot-' + i);
      slot.className = 'card-slot';
      slot.innerHTML = `<div class="card-back-mark"><span class="umbrella">☂️</span>タップして<br>めくる</div>`;
    });
    document.getElementById('btnAI-three').disabled = true;
  }
  ensureDrawn(mode);
}
</script>
</body>
</html>
